server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # 录像媒体直通（回放播放/下载，大文件 + Range seek）：不经过 Node BFF
    # （Node fetch 会把响应整体缓冲到内存），由 nginx 直连宿主 ainvr-recorder:8100。
    # 控制面 /api/v1/recorder/* 仍走下方 BFF 代理；此处仅媒体。
    location /api/v1/recordings/ {
        proxy_pass http://host.docker.internal:8100/v1/recordings/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 3600s;
    }

    # BFF API
    location /ingest/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        client_max_body_size 64k;
    }

    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $console_forwarded_proto;
        proxy_read_timeout 30s;
    }

    # SRS HTTP-FLV / HLS 流
    location /live/ {
        auth_request /_media_auth;
        proxy_pass http://srs:8080/live/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 直播流关缓冲，否则会攒一大段再发给客户端，延迟高且浏览器首帧等待久
        proxy_buffering off;
        proxy_read_timeout 3600s;
        add_header Cache-Control no-cache;
    }

    # SRS WebRTC 信令（/rtc 接口）
    location /rtc/ {
        auth_request /_media_auth;
        proxy_pass http://srs:1985/rtc/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # SRS 控制台（可选，方便调试）
    location /srs/ {
        return 404;
    }

    location = /_media_auth {
        internal;
        proxy_pass http://backend:3001/api/auth/media-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $console_forwarded_proto;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Console-Token $http_x_console_token;
    }

    location /media/ {
        auth_request /_media_auth;
        proxy_pass http://srs:8080/;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # 带 content hash 的静态资源（文件名变了才会重新下载，可以放心长缓存）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退：index.html 本身不能被缓存，否则每次发布后浏览器可能
    # 继续用旧的 index.html（其中写死了旧的带 hash 资源文件名），看起来就像
    # "代码没有重新部署"——实际是浏览器没有拿到新版 index.html。
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
