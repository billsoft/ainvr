# Internal HLS worker. No published port, API, RTC, forwarding or DVR.
listen 127.0.0.1:1936;
pid /run/srs-hls.pid;
daemon off;
srs_log_tank console;
srs_log_level warn;
max_connections 100;
http_api { enabled off; }
http_server { enabled off; }
rtc_server { enabled off; }
vhost __defaultVhost__ {
    play { gop_cache off; queue_length 10; }
    hls {
        enabled on;
        hls_path /run/srs-http;
        hls_fragment 10;
        hls_window 30;
        hls_cleanup on;
        hls_dispose 60;
        # Fail ONLY the internal forwarding connection. It reconnects after
        # space is available; never disable HLS until the camera republishes.
        hls_on_error disconnect;
    }
}
