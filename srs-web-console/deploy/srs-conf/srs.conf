# SRS 配置（docker-compose 部署用）
# SRS 7.0.162；HLS 由独立进程生成，主进程只转发并提供 HTTP 文件读取。

listen              1935;
max_connections     1000;
daemon              off;
pid                 /run/srs-ingest.pid;
srs_log_tank        console;
srs_log_level      info;

http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

http_server {
    enabled         on;
    listen          8080;
    dir             /run/srs-http;
}

rtc_server {
    enabled         on;
    listen          8000;
    # WebRTC 候选地址。默认自动（candidate *）：把浏览器打开控制台时的地址（nginx
    # 透传的 Host）作为候选地址，任何网卡、本机改 IP 后都自动正确；不自动探测容器
    # 内网地址（局域网不可达）。控制台「系统配置 → 流媒体配置 → WebRTC 播放地址」
    # 选「指定地址」时，backend/src/services/srsConfWriter.ts 原地改写下面这一行并
    # 触发热重载（不重启容器），该地址在访问地址之外额外宣告。SRS 7.0.162 实测。
    # 发布包里这一行必须是 *（build-release.sh 强制、audit_release.py 校验）。
    candidate       *;
    use_auto_detect_network_ip off;
    api_as_candidates on;
}

srt_server {
    enabled on;
    listen 10080;
    latency 200;
    peerlatency 200;
    recvlatency 200;
}

vhost __defaultVhost__ {
    srt {
        enabled on;
        srt_to_rtmp on;
    }
    # RTMP 推流
    rtc {
        enabled on;
        rtmp_to_rtc on;
        rtc_to_rtmp on;
    }

    # ===== 低延迟（2026-09-13 排查"WebRTC 开播约 3s，运行一段时间或源流
    # 中断恢复后累积到 8s+"后按 SRS v6 官方低延迟配置收敛）=====
    # TCP_NODELAY：小包即时发送，不攒 Nagle
    tcp_nodelay     on;
    # 最低延迟模式：consumer 队列超时等待、来包即发（WebRTC 路径 SRS 默认
    # 已开，显式写死同时惠及 FLV/RTMP 降级链路）
    min_latency     on;

    play {
        # 保留 GOP 缓存：源流 GOP=8.33s（实测），关掉后新播放者最长要等
        # 8.33s 才出画；保留则开播即拿到上一个关键帧（典型 3~4s 旧画面，
        # 用户可接受）。累积延迟的根因不是它，是下面两个默认值。
        gop_cache       on;
        # consumer 队列上限（秒；SRS 默认 30）。默认值下源流中断/网络抖动
        # 时旧消息在服务器侧为这个连接堆积且永不追回——这是"运行一段时间
        # 延迟涨到 8s"的服务器侧根因。溢出时 SRS 向最近关键帧收缩丢帧。
        # 取 10s：略大于一个 GOP(8.33s)，保证收缩时总能找到关键帧。
        queue_length    10;
        # 合并写延迟（ms；默认 350）。攒批发包会让播放端 WebRTC jitter
        # buffer 被突发喂大；100 是官方低延迟推荐值（WebRTC 路径默认即 0）。
        mw_latency      100;
    }

    # 推流超时：WiFi/弱网环境下，默认 5s 太短，短暂抖动就踢流
    # normal_timeout：连接建立后正常推流时，连续收不到数据的超时时间
    # firstpkt_timeout 保持默认 20s（首包等待，不用改）
    publish {
        normal_timeout 10000;
    }

    http_remux {
        enabled on;
        mount [vhost]/[app]/[stream].flv;
    }

    hls { enabled off; }
    # Forwarder uses a separate coroutine and the bounded play.queue_length.
    # A stalled HLS worker loses its own queued frames, never waits in on_video.
    forward {
        enabled on;
        destination 127.0.0.1:1936;
    }
}
