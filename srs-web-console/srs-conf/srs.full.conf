# ============================================================
# SRS 6.0.191 全协议配置 — SRS Web Console 专用
# 项目：srs-web-console（挂载到容器 /usr/local/srs/conf/）
# 说明：
#   - daemon off：前台运行，交由 Docker 管理
#   - $CANDIDATE：由容器启动环境变量注入本机 IP（镜像 entrypoint envsubst 处理）
#   - crossdomain 双开：dev 阶段前端 5173 跨端口拉流/调 API 需要
#   - rtc_to_rtmp 关闭：监控场景无 WebRTC 推流需求，省 arm64 转码开销；
#     将来需要 WebRTC 推流时再打开
# ============================================================

listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

# ---- HTTP API（BFF 与管理接口）----
http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

# ---- HTTP Server（HTTP-FLV / HLS / HTTP-TS 拉流）----
http_server {
    enabled         on;
    listen          8080;
    dir             /usr/local/srs/objs/nginx/html;
    crossdomain     on;
}

# ---- WebRTC 服务器（低延迟播放）----
rtc_server {
    enabled         on;
    listen          8000;
    # 必须是开发板 LAN IP 或 *（自动发现），不能是 127.0.0.1/容器内网 IP
    # 容器采用 --net=host 部署：* 自动发现真实网卡 IP，DHCP 变化免疫
    # （实测镜像 Entrypoint=null 无 envsubst 机制，$CANDIDATE 不会被替换）
    candidate       *;
}

# ---- SRT 服务器（摄像头/编码器推流）----
srt_server {
    enabled         on;
    listen          10080;
}

# ---- 默认 vhost：全协议输出 ----
vhost __defaultVhost__ {
    # SRT 推流进入本 vhost（listener 模式）
    srt {
        enabled     on;
    }

    # HTTP-FLV 动态拉流
    # 注意：SRS 6 同一 vhost 内 http-ts 与 hls 冲突（实测 ConfigInvalid 1023），
    # 监控场景保留 HLS，HTTP-TS 不启用；TS 需求由 HLS 分片覆盖
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    # HLS 录制与拉流（2s 分片 × 6 = 12s 窗口）
    hls {
        enabled         on;
        hls_path        /usr/local/srs/objs/nginx/html;
        hls_fragment    2;
        hls_window      12;
    }

    # WebRTC 播放（RTMP 推流转 WebRTC 输出）
    rtc {
        enabled     on;
        rtmp_to_rtc on;
    }
}
