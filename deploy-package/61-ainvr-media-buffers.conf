# AINVR media UDP socket ceilings (SRS requests 10 MiB explicitly).
# Do not raise defaults for every process. Linux reports doubled SO_*BUF sizes.
# Applied to newly created / explicitly resized sockets; restart SRS to apply.
# This bounds burst buffering; it does not fix Wi-Fi loss or change video bitrate.
net.core.wmem_max = 10485760
net.core.rmem_max = 10485760
