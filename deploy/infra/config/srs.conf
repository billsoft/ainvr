# Copyright AINVR. RTMP, HTTP-FLV, WebRTC and SRT baseline.
listen 1935;
max_connections 1000;
daemon off;
auto_reload_for_docker on;
pid /run/srs-ingest.pid;
srs_log_tank console;
srs_log_level info;
http_api {
    enabled on;
    listen 127.0.0.1:1985;
    crossdomain on;
}
http_server {
    enabled on;
    listen 127.0.0.1:8080;
    dir /run/srs-http;
}
rtc_server {
    enabled on;
    listen 8000;
    candidate       *;
    use_auto_detect_network_ip off;
    api_as_candidates on;
}
srt_server {
    enabled on;
    listen 10080;
    latency 200;
    peerlatency 200;
    recvlatency 200;
}
vhost __defaultVhost__ {
    tcp_nodelay on;
    min_latency on;
    play {
        gop_cache on;
        queue_length 10;
        # SRS 7 fixes SO_SNDBUF to 4Mbps * mw_latency.
        # 350ms gives 175KB; 100ms/50KB dropped real 4K RTMP.
        mw_latency 350;
    }
    publish { normal_timeout 10000; }
    srt { enabled on; srt_to_rtmp on; }
    rtc { enabled on; rtmp_to_rtc on; rtc_to_rtmp on; }
    http_remux { enabled on; mount [vhost]/[app]/[stream].flv; }
    # HLS runs independently so segment I/O cannot stall camera ingestion.
    hls { enabled off; }
    forward { enabled on; destination 127.0.0.1:1936; }
}
